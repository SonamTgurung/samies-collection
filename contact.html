<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Us | Samie's Collection</title>
  <meta name="description" content="Visit the Samie's Collection store: address, opening hours, and how to reach us on WhatsApp, Instagram and TikTok.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <p class="eyebrow">Visit Us</p>
      <h1>We'd love to see you</h1>
    </div>

    <section class="contact-grid" style="padding-bottom: 88px;">
      <div>
        <div class="contact-block">
          <h3>The Store</h3>
          <p id="c-address"></p>
        </div>
        <div class="contact-block">
          <h3>Opening Hours</h3>
          <div id="c-hours"></div>
        </div>
        <div class="contact-block">
          <h3>Call or Message</h3>
          <p id="c-phone"></p>
        </div>
        <div class="contact-block contact-actions">
          <a class="btn btn-wa" id="c-wa" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
          <a class="btn btn-outline" id="c-directions" href="#" target="_blank" rel="noopener">Get Directions</a>
        </div>
        <div class="contact-block">
          <h3>Follow Us</h3>
          <div class="social" data-social></div>
        </div>
      </div>
      <iframe class="map" id="c-map" title="Store location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/store-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
